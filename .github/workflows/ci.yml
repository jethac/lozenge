name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrast & gamut contract
        run: npm run check
      - name: Markup contracts (source fixture)
        run: npm run lint
      - name: Build CSS
        run: npm run build
      - name: Build docs
        run: npm run docs
      - name: Build site
        run: npx vite build
      - name: Markup contracts (built output, post-expansion)
        run: node scripts/lozenge-lint.mjs "site/**/*.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate Dart engine + fixture
        run: npm run tokens:dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        working-directory: packages/lozenge_flutter
        run: flutter pub get && flutter analyze
      - name: Cross-engine token test + widget tests
        working-directory: packages/lozenge_flutter
        run: flutter test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
